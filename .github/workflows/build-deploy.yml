# One workflow for everything: daily data refresh + build + deploy.
#
# Why one workflow? Commits pushed with the Action's GITHUB_TOKEN do NOT
# trigger other workflows, so fetching data, building and deploying must
# all happen in the same run.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 6:00 AM IST
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write # deploy to GitHub Pages
  id-token: write # required by deploy-pages

# Never run two deploys at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Astro 7 needs Node >= 22.12
          cache: npm

      - name: Install dependencies
        # Playwright is a devDependency used only for local QA and
        # `npm run gen:icons` — never in this workflow — so skip its
        # (large, unused) browser-binary download here.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # ---- Daily data refresh (schedule / manual runs only) -------------
      # Each step is skipped until its script exists, and never fails the
      # build: a broken source should not stop the site from deploying.
      - name: Fetch news
        if: github.event_name != 'push' && hashFiles('scripts/fetch-news.mjs') != ''
        continue-on-error: true
        run: node scripts/fetch-news.mjs

      - name: AI enrichment (optional)
        if: github.event_name != 'push' && hashFiles('scripts/ai-enrich.mjs') != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/ai-enrich.mjs

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: daily data refresh"
            git push
          fi

      # ---- Build ----------------------------------------------------------
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
